version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg16-postgis
    container_name: borbandh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: borbandh
      POSTGRES_USER: borbandh_app
      POSTGRES_PASSWORD: borbandh_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: borbandh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: borbandh-backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: "postgres://borbandh_app:borbandh_secure_password@db:5432/borbandh?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
